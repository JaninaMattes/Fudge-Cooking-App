# Pipeline of the REST API.
#
# The pipeline runs on each push and on each pull request that changes the
# backend. It does the same steps as "make backend-verify" on a local machine:
# style check, tests, coverage gate and static analysis.
name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  # A new push stops the run of the last push of the same branch.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend/food-tracker-api

jobs:
  verify:
    name: Style, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Read the repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # The action keeps the Maven packages, so the next run is faster.
          cache: 'maven'

      - name: Make the Maven wrapper runnable
        run: chmod +x ./mvnw

      - name: Check the style
        run: ./mvnw -B checkstyle:check

      - name: Run the tests, the coverage gate and the static analysis
        run: ./mvnw -B clean verify

      - name: Report the result of the tests
        uses: dorny/test-reporter@v1
        # The step also runs when a test fails, so that the report is visible.
        if: success() || failure()
        with:
          name: Backend tests
          path: backend/food-tracker-api/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Keep the reports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: backend-reports
          path: |
            backend/food-tracker-api/target/site/jacoco/
            backend/food-tracker-api/target/surefire-reports/
            backend/food-tracker-api/target/spotbugsXml.xml
          retention-days: 14

      - name: Write the coverage into the summary of the run
        if: success() || failure()
        run: |
          REPORT=target/site/jacoco/jacoco.csv
          if [ -f "$REPORT" ]; then
            awk -F, 'NR > 1 {
              im += $4; ic += $5; bm += $6; bc += $7
            } END {
              printf "## Coverage of the backend\n\n"
              printf "| Measure | Value |\n|---|---|\n"
              printf "| Instructions | %.1f%% |\n", 100 * ic / (im + ic)
              printf "| Branches | %.1f%% |\n", 100 * bc / (bm + bc)
            }' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

  package:
    name: Build the JAR file
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Read the repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make the Maven wrapper runnable
        run: chmod +x ./mvnw

      - name: Build the JAR file
        run: ./mvnw -B package -DskipTests

      - name: Keep the JAR file
        uses: actions/upload-artifact@v4
        with:
          name: food-tracker-api-jar
          path: backend/food-tracker-api/target/*.jar
          retention-days: 14
