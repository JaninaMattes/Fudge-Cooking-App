# Pipeline of the Android client.
#
# The pipeline runs the style check, the unit tests and the build on each
# push. The test of the user interface runs on an emulator. That test needs
# much time, so it runs only on the main branch and on request.
name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/android-feedme-app

jobs:
  verify:
    name: Style, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Read the repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # The action keeps the Gradle packages, so the next run is faster.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - name: Check the style of the Kotlin code
        run: ./gradlew --console=plain ktlintCheck

      - name: Search for errors in the Kotlin code
        run: ./gradlew --console=plain detekt

      - name: Run the Android Lint
        run: ./gradlew --console=plain lintDebug

      - name: Run the unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Write the coverage report
        if: success() || failure()
        run: ./gradlew --console=plain jacocoTestReport

      - name: Build the debug APK
        run: ./gradlew --console=plain assembleDebug

      - name: Report the result of the tests
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Frontend unit tests
          path: frontend/android-feedme-app/app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Write the result of the tests into the summary of the run
        if: success() || failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print('## Unit tests of the Android client\n')
          print(f'| Measure | Value |\n|---|---|\n| Tests | {total} |\n| Failed | {failed} |')
          PY

      - name: Keep the reports and the APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: frontend-reports
          path: |
            frontend/android-feedme-app/app/build/reports/
            frontend/android-feedme-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ui-test:
    name: Test of the user interface on an emulator
    runs-on: ubuntu-latest
    needs: verify
    # The emulator needs much time, so the job runs on the main branch and on
    # request only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Read the repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Give the emulator the hardware support of the machine
        run: |
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - name: Run the tests on the emulator and record a video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: frontend/android-feedme-app
          # The emulator needs no window and no sound in the pipeline.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell screenrecord --time-limit 180 /sdcard/ui-test.mp4 &
            ./gradlew --console=plain connectedDebugAndroidTest || true
            sleep 2
            adb pull /sdcard/ui-test.mp4 ui-test.mp4 || true

      - name: Keep the video and the report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ui-test-video
          path: |
            frontend/android-feedme-app/ui-test.mp4
            frontend/android-feedme-app/app/build/reports/androidTests/
          retention-days: 14
