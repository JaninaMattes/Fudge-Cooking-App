# Maven that the wrapper downloads and uses.
#
# The build needs Maven 3.8.9 or later, because the plugin of SpotBugs asks for
# that version. Call the wrapper with "sh ./mvnw", because the file mvnw has no
# execute permission in this repository.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/io/takari/maven-wrapper/0.5.6/maven-wrapper-0.5.6.jar
