# ---------------------------------------------------------------------------
# Food Tracker API
#
# Every value below reads an environment variable first and uses the value
# after the colon only when the variable is not set. No credential is in this
# file, so the file can go into the repository.
#
# Example of a local start:
#   export FT_DB_PASSWORD=my-password
#   export FT_API_SECRET_KEY=my-secret
#   mvn spring-boot:run
# ---------------------------------------------------------------------------

# Tomcat server. The Android client and docker-compose.yml expect port 80.
server.port=${FT_SERVER_PORT:80}
server.address=${FT_SERVER_ADDRESS:0.0.0.0}

# Logging.
#
# Each line holds the ID of the request in square brackets. RequestLogFilter
# puts that ID into the diagnostic context of the logger, so every line of one
# request carries the same ID. A line outside a request shows a minus.
#
# The file keeps ten files of 10 MB, so a long run cannot fill the disk.
logging.level.org.springframework=${FT_LOG_LEVEL_SPRING:INFO}
logging.level.com.foodtracker=${FT_LOG_LEVEL_APP:DEBUG}
logging.file.name=${FT_LOG_FILE:${java.io.tmpdir}/food-tracker-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:--}] %logger{36} - %msg%n

# PostgreSQL database
spring.datasource.url=${FT_DB_URL:jdbc:postgresql://localhost:5432/foodtrackerdb}
spring.datasource.username=${FT_DB_USER:foodtracker}
spring.datasource.password=${FT_DB_PASSWORD:password}
spring.datasource.driverClassName=org.postgresql.Driver

# Credentials of the API and of the external APIs.
# See com.foodtracker.foodtrackerapi.common.config.ApiProperties
foodtracker.api.secret-key=${FT_API_SECRET_KEY:change-me-in-production}
foodtracker.api.token-validity-millis=${FT_TOKEN_VALIDITY_MILLIS:7200000}
foodtracker.api.spoonacular-recipe-key=${FT_SPOONACULAR_KEY:}
foodtracker.api.edamam-app-id=${FT_EDAMAM_APP_ID:}
foodtracker.api.edamam-barcode-key=${FT_EDAMAM_BARCODE_KEY:}
foodtracker.api.edamam-recipe-key=${FT_EDAMAM_RECIPE_KEY:}
