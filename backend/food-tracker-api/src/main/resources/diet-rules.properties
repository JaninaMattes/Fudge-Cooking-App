# Which ingredients a dietary requirement forbids.
#
# version:  1
# reviewed: 14 November 2026, by hand
#
# The rules were read once from public sources and reviewed by a person. They
# ship with the application, so no suggestion needs a request to the internet.
# That is requirement N-14 of docs/PRODUCT.md. The file is a .properties file
# and not a .yaml file, because the JDK reads properties and the project holds
# no parser for YAML.
#
# How a rule is read:
#
#   * A word of "forbids" matches when it stands anywhere in the name of an
#     ingredient, so "meat" also catches "minced meat".
#   * A word of "allows" wins over "forbids". Without it "coconut milk" would
#     count as milk and "eggplant" as an egg.
#   * The key is the label of the dietary requirement, in lower case and with
#     a dash in place of a space: "No Pig" becomes "no-pig".
#
# A requirement that stands in this file is a **hard** rule: a recipe that
# breaks it is never suggested (FR-3.1). A requirement that does **not** stand
# here is a preference, such as "Mediterranean", "Low Carb" or "Fitness". A
# preference never hides a recipe; the recommender of FR-R1 will use it to
# rank one recipe above another.

vegan.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, ham, \
    sausage, salami, boar, veal, lamb, duck, fish, salmon, tuna, anchovy, \
    prawn, shrimp, crab, lobster, gelatin, lard, milk, cream, butter, \
    cheese, quark, yoghurt, yogurt, egg, honey
vegan.allows = coconut milk, soy milk, oat milk, almond milk, rice milk, \
    peanut butter, almond butter, cocoa butter, shea butter, eggplant, \
    butternut, buttercup squash, milk thistle, fruit, legumes, nuts, seeds, \
    mushrooms, plant oils, vinegar, nutritional yeast, seaweed, tofu, miso

vegetarian.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, ham, \
    sausage, salami, boar, veal, lamb, duck, fish, salmon, tuna, anchovy, \
    prawn, shrimp, crab, lobster, gelatin, lard
vegetarian.allows = eggplant, butternut, buttercup squash, prawn, shrimp, crab, \
    lobster, gelatin, lard, milk, cream, butter, cheese, quark, yoghurt, yogurt, \
    egg, honey, tofu

pescatarian.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, \
    ham, sausage, salami, boar, veal, lamb, duck, lard
pescatarian.allows = eggplant, butternut, buttercup squash

no-pork.forbids = pork, bacon, ham, lard, gammon, salami, gelatin
no-pork.allows = beef, chicken, lamb, fish, prawn, shrimp, crab, lobster

# Kosher holds more rules than a list of ingredients can carry, above all the
# separation of meat and milk. This entry therefore covers the forbidden
# animals only, and the application must never call a recipe "kosher
# certified".
kosher.forbids = pork, bacon, ham, lard, gammon, prawn, shrimp, crab, \
    lobster, mussel, oyster, squid, rabbit, horse
kosher.allows =
