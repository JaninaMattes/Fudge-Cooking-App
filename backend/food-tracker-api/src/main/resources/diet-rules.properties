# Which ingredients a requirement forbids.
#
# version:  2
# reviewed: 14 November 2026, by hand
#
# The rules were read once from public sources and reviewed by a person. They
# ship with the application, so no suggestion needs a request to the internet.
# That is requirement N-14 of docs/PRODUCT.md. The file is a .properties file
# and not a .yaml file, because the JDK reads properties and the project holds
# no parser for YAML.
#
# How a rule is read:
#
#   * A word of "forbids" matches when it stands anywhere in the name of an
#     ingredient, so "meat" also catches "minced meat".
#   * A word of "despite" is an **exception that rescues a false positive**:
#     "coconut milk" holds "milk" and is still vegan, "buckwheat" holds
#     "wheat" and holds no gluten. It is **not** a list of what a diet
#     permits. A word that stands in "forbids" and in "despite" of the same
#     requirement stops the start of the application.
#   * The key is the label of the tag, in lower case and with a dash in place
#     of a space: "No pork" becomes "no-pork".
#
# Two kinds of requirement:
#
#   * A **medical** requirement — an allergy or an illness — is a veto. It is
#     never traded against anything. A medical requirement whose label this
#     file does not name forbids **the ingredient that its own label says**,
#     so a user can name an allergy that nobody foresaw: a tag "Celery" or
#     "Celery-free" forbids celery.
#   * Every other requirement that stands here is a diet. A requirement that
#     does not stand here at all is a taste, such as "Mediterranean" or "Low
#     carb"; it hides no recipe, and the recommender of FR-R1 ranks with it.
#
# Where a rule is in doubt, it forbids. A suggestion that a user cannot eat
# is worse than a suggestion that never arrives.

# --- Diets -------------------------------------------------------------------

vegan.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, ham, \
    sausage, salami, boar, veal, lamb, duck, fish, salmon, tuna, anchovy, \
    prawn, shrimp, crab, lobster, gelatin, lard, milk, cream, butter, \
    cheese, quark, yoghurt, yogurt, egg, honey
vegan.despite = coconut milk, soy milk, oat milk, almond milk, rice milk, \
    peanut butter, almond butter, cocoa butter, shea butter, eggplant, \
    butternut, buttercup squash, milk thistle

vegetarian.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, ham, \
    sausage, salami, boar, veal, lamb, duck, fish, salmon, tuna, anchovy, \
    prawn, shrimp, crab, lobster, gelatin, lard
vegetarian.despite = eggplant, butternut, buttercup squash

pescatarian.forbids = meat, beef, pork, chicken, poultry, turkey, bacon, \
    ham, sausage, salami, boar, veal, lamb, duck, lard
pescatarian.despite = eggplant, butternut, buttercup squash

no-pork.forbids = pork, bacon, ham, lard, gammon, salami, gelatin
no-pork.despite =

# Kosher holds more rules than a list of ingredients can carry, above all the
# separation of meat and milk. This entry therefore covers the forbidden
# animals only, and the application must never call a recipe "kosher
# certified".
kosher.forbids = pork, bacon, ham, lard, gammon, prawn, shrimp, crab, \
    lobster, mussel, oyster, squid, rabbit, horse
kosher.despite =

# --- Medical requirements ----------------------------------------------------
#
# A user who sets one of these never sees a recipe that holds one of the
# words. The lists are wide on purpose.

nut-free.forbids = nut, peanut, almond, hazelnut, walnut, cashew, pistachio, \
    pecan, macadamia, brazil, praline, marzipan, nougat, frangipane
# "nutmeg" is a seed and "nutritional yeast" is a flake; neither is a nut.
# "butternut" is a squash. Coconut is **not** rescued here: some people who
# react to tree nuts react to it, so the safe side is to leave it out.
nut-free.despite = nutmeg, nutritional yeast, butternut

gluten-free.forbids = wheat, flour, barley, rye, spelt, semolina, couscous, \
    bulgur, bread, breadcrumb, pasta, noodle, spaghetti, pastry, malt, \
    seitan, beer
gluten-free.despite = buckwheat, rice flour, corn flour, almond flour, \
    chickpea flour, gluten-free flour

lactose-free.forbids = milk, cream, butter, cheese, quark, yoghurt, yogurt, \
    whey, buttermilk, condensed milk, ice cream
lactose-free.despite = coconut milk, soy milk, oat milk, almond milk, \
    rice milk, lactose-free milk, peanut butter, almond butter, cocoa butter, \
    shea butter, butternut, buttercup squash, milk thistle

egg-free.forbids = egg, mayonnaise, meringue, albumen
egg-free.despite = eggplant

# A diabetic requirement cannot be decided from a list of ingredients: the
# carbohydrate of a portion decides, and the application does not hold that
# number yet. The entry is empty **on purpose**, so that the requirement is
# visibly undecided instead of silently passing. The application must not
# call a recipe suitable for a diabetic user until FR-R1 reads the nutrition.
diabetic-friendly.forbids =
diabetic-friendly.despite =
