// Build file of the Android client.
//
// The versions are in gradle/libs.versions.toml.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    // Replaces the old plugin kotlin-android-extensions, which Google removed.
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.navigation.safeargs)
    alias(libs.plugins.hilt)
    id 'jacoco'
}

android {
    // The Android Gradle Plugin 8 reads the package name here and no longer
    // from the manifest.
    namespace 'com.mobilesystems.feedme'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.mobilesystems.feedme"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The test of the user interface must not stop after the first error,
        // so that the demo video shows all screens.
        testInstrumentationRunnerArguments clearPackageData: 'false'
    }

    buildTypes {
        debug {
            // The report of the coverage needs this setting.
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            // A unit test can then read the resources of res/values.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkDependencies true
        textReport true
        htmlReport true
        xmlReport true
        baseline file('lint-baseline.xml')
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/LICENSE*']
        }
    }
}

kapt {
    correctErrorTypes true
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

// Report of the test coverage. Use "./gradlew jacocoTestReport".
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    description = 'Writes the coverage report of the unit tests.'
    group = 'verification'

    reports {
        xml.required = true
        html.required = true
    }

    // The build tools write these classes, so they are not part of the report.
    def excludes = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', '**/databinding/**', '**/hilt_aggregated_deps/**',
            '**/*_Factory*.*', '**/*_HiltModules*.*', '**/*_Impl*.*',
            '**/Dagger*Component*.*', '**/*Module_*Factory.*', '**/*_MembersInjector*.*',
            '**/*_GeneratedInjector*.*', '**/Hilt_*.*'
    ]
    classDirectories.setFrom(
            fileTree(dir: "${layout.buildDirectory.get()}/tmp/kotlin-classes/debug",
                    excludes: excludes)
    )
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get(), includes: ['**/*.exec']))
}

dependencies {

    // --- AndroidX ------------------------------------------------------------
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.annotation
    implementation libs.androidx.legacy.support
    implementation libs.material

    // --- Layout --------------------------------------------------------------
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager2

    // --- ViewModel, LiveData and navigation ----------------------------------
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // --- Background work -----------------------------------------------------
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.hilt.work
    kapt libs.androidx.hilt.compiler

    // --- Dependency injection ------------------------------------------------
    implementation libs.hilt.android
    kapt libs.hilt.compiler

    // --- Network -------------------------------------------------------------
    implementation platform(libs.okhttp.bom)
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.gson

    // --- Pictures ------------------------------------------------------------
    implementation libs.glide
    kapt libs.glide.compiler
    implementation libs.picasso
    implementation libs.circleimageview
    implementation libs.zxing.android.embedded

    // --- Kotlin --------------------------------------------------------------
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlin.result
    implementation libs.kotlin.result.coroutines

    // --- Tests on the development machine ------------------------------------
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core

    // --- Tests on a telephone or on an emulator ------------------------------
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.espresso.intents
}
