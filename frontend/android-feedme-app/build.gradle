// Build file of the whole project.
//
// The versions of the plugins and of the libraries are in
// gradle/libs.versions.toml. This file only says which plugins the project
// uses and which rules each module follows.

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.kapt) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.navigation.safeargs) apply false
    alias(libs.plugins.ktlint)
    alias(libs.plugins.detekt)
}

subprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: "io.gitlab.arturbosch.detekt"

    // Style of the Kotlin code. Use "./gradlew ktlintCheck".
    ktlint {
        version = libs.versions.ktlint.get()
        android = true
        ignoreFailures = false
        filter {
            // The build tools write these files, so the rules do not apply.
            exclude { element -> element.file.path.contains("generated/") }
            exclude { element -> element.file.path.contains("/build/") }
        }
        reporters {
            reporter "plain"
            reporter "checkstyle"
        }
    }

    // Static analysis of the Kotlin code. Use "./gradlew detekt".
    detekt {
        buildUponDefaultConfig = true
        allRules = false
        config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
        baseline = file("$rootDir/config/detekt/baseline.xml")
    }

    tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
        jvmTarget = "17"
        reports {
            html.required = true
            xml.required = true
            sarif.required = false
            md.required = false
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
