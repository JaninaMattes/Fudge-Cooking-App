// Build file of the whole project. It holds the settings that each module uses.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.3.5"
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.38.1"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    // Style of the Kotlin code. Use "./gradlew ktlintCheck".
    id "org.jlleitschuh.gradle.ktlint" version "11.6.1"
    // Static analysis of the Kotlin code. Use "./gradlew detekt".
    id "io.gitlab.arturbosch.detekt" version "1.23.4"
}

subprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: "io.gitlab.arturbosch.detekt"

    ktlint {
        version = "1.0.1"
        android = true
        ignoreFailures = false
        // The build tools write these files, so the style rules do not apply.
        filter {
            exclude { element -> element.file.path.contains("generated/") }
        }
        reporters {
            reporter "plain"
            reporter "checkstyle"
        }
    }

    detekt {
        buildUponDefaultConfig = true
        allRules = false
        config = files("$rootDir/config/detekt/detekt.yml")
        baseline = file("$rootDir/config/detekt/baseline.xml")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
