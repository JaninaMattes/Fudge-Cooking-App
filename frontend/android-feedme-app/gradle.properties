# Settings of Gradle for this project.
# See http://www.gradle.org/docs/current/userguide/build_environment.html

# Memory of the Gradle process. The Android Gradle Plugin 8 needs more memory
# than the old version.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Gradle builds the modules at the same time, so the build is faster.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# The libraries of the project all use AndroidX.
android.useAndroidX=true

# Jetifier changes an old support library into AndroidX. No library of this
# project needs it any more, and the step makes each build slower.
android.enableJetifier=false

# The Android Gradle Plugin 8 writes a BuildConfig class only on request.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Style of the Kotlin code: "official" or "obsolete".
kotlin.code.style=official
